<script>
// ============================================================
// spatial3d.js – Solo espacialización 3D con HRTF
// ============================================================
(function() {
  const spatialVoices = new WeakMap();
  let audioCtx = null;

  function getCtx() {
    if (!audioCtx) {
      try {
        audioCtx = getAudioContext();
      } catch(e) { return null; }
    }
    return audioCtx;
  }

  function createSpatialVoice(osc) {
    const ctx = getCtx();
    if (!ctx) return null;
    if (spatialVoices.has(osc)) return spatialVoices.get(osc);

    const panner = ctx.createPanner();
    panner.panningModel = 'HRTF';
    panner.distanceModel = 'linear';
    panner.refDistance = 200;
    panner.maxDistance = 1000;
    panner.rolloffFactor = 1;
    panner.coneInnerAngle = 360;
    panner.coneOuterAngle = 0;
    panner.coneOuterGain = 0;
    panner.positionX.value = 0;
    panner.positionY.value = 0;
    panner.positionZ.value = 0;

    const gain = ctx.createGain();
    gain.gain.value = 1;

    try {
      osc.disconnect();
      osc.connect(gain);
      gain.connect(panner);
      if (globalCompressor) {
        panner.connect(globalCompressor);
      } else {
        panner.connect(ctx.destination);
      }
    } catch(e) {
      try {
        osc.disconnect();
        osc.connect(panner);
        if (globalCompressor) {
          panner.connect(globalCompressor);
        } else {
          panner.connect(ctx.destination);
        }
      } catch(e2) {}
    }

    const voiceData = { panner, osc, gain };
    spatialVoices.set(osc, voiceData);
    return voiceData;
  }

  function updateSpatialVoice(osc, x, y, z) {
    const data = spatialVoices.get(osc);
    if (!data || !data.panner) return;
    const panner = data.panner;
    try {
      panner.positionX.value = x;
      panner.positionY.value = y;
      panner.positionZ.value = z;
    } catch(e) {
      try { panner.setPosition(x, y, z); } catch(e2) {}
    }
  }

  function updateListener(x, y, z, rotX, rotY) {
    const ctx = getCtx();
    if (!ctx) return;
    try {
      if (ctx.listener.positionX) {
        ctx.listener.positionX.value = x;
        ctx.listener.positionY.value = y;
        ctx.listener.positionZ.value = z;
        
        // Rotación sutil del listener
        let fwdX = -Math.sin(rotY);
        let fwdZ = -Math.cos(rotY);
        let fwdY = Math.sin(rotX) * 0.1;
        let fwdLen = Math.sqrt(fwdX*fwdX + fwdY*fwdY + fwdZ*fwdZ);
        if (fwdLen > 0) { fwdX /= fwdLen; fwdY /= fwdLen; fwdZ /= fwdLen; }
        
        let upX = Math.sin(rotX) * 0.15;
        let upY = 0.9;
        let upZ = 0;
        
        ctx.listener.forwardX.value = fwdX;
        ctx.listener.forwardY.value = fwdY;
        ctx.listener.forwardZ.value = fwdZ;
        ctx.listener.upX.value = upX;
        ctx.listener.upY.value = upY;
        ctx.listener.upZ.value = upZ;
      } else {
        ctx.listener.setPosition(x, y, z);
      }
    } catch(e) {}
  }

  window.createSpatialVoice = createSpatialVoice;
  window.updateSpatialVoice = updateSpatialVoice;
  window.updateListener = updateListener;
})();

// ============================================================
// CÓDIGO ORIGINAL – SIN NINGÚN CAMBIO VISUAL O DE SONIDO
// ============================================================

let inc=0.05,scl=10;
let cols,rows,zoff=0;
let particles=[],flowfield;
let maxSpeed=0.5;
let audioStarted=false;

let globalReverb,globalDelay,globalCompressor,amplitude;

let droneOsc=[],currentFreqs=[],targetFreqs=[],freqChangeDuration=10000;

let voicePool=[],voiceIndex=0,VOICES=20;

let erasePoint=null;
let eraseRadiusSq=120*120;

let lastTouchGrainTime=0;
let TOUCH_GRAIN_INTERVAL=30;

// Variables para el puntero - SOLO POSICIÓN, SIN SONIDO PROPIO
let pointerX = -1000;
let pointerY = -1000;
let pointerActive = false;

// MASTER VOLUMEN
let masterVolume = 0.9;
let isMuted = false;

// Rotación del listener
let listenerRotX = 0;
let listenerRotY = 0;

function setup(){
  pixelDensity(1);
  createCanvas(windowWidth,windowHeight);
  frameRate(60);

  colorMode(HSB,660,900,100,10000);

  cols=floor(width/scl);
  rows=floor(height/scl);
  flowfield=new Array(cols*rows);

  globalReverb=new p5.Reverb();
  globalReverb.set(40,20);

  globalDelay=new p5.Delay();
  globalDelay.process(globalReverb,0.4,0.6,1800);

  globalCompressor=new p5.Compressor();
  globalCompressor.attack(0.02);
  globalCompressor.release(0.4);
  globalCompressor.threshold(-24);
  globalCompressor.ratio(8);
  globalCompressor.connect();

  amplitude=new p5.Amplitude();
  amplitude.setInput(globalCompressor);

  for(let i=0;i<8;i++){
    let osc=new p5.Oscillator('sine');
    let f=random(200,600);
    osc.freq(f);
    osc.amp(0);
    osc.disconnect();
    osc.connect(globalReverb);
    osc.connect(globalDelay);
    osc.connect(globalCompressor);
    osc.start();
    droneOsc.push(osc);
    currentFreqs.push(f);
    targetFreqs.push(f);
  }

  for(let i=0;i<VOICES;i++){
    let osc=new p5.Oscillator('sine');
    osc.amp(0);
    osc.disconnect();
    osc.connect(globalReverb);
    osc.connect(globalDelay);
    osc.connect(globalCompressor);
    osc.start();
    voicePool.push(osc);
  }

  for(let i=0;i<800;i++) particles.push(new Particle());

  setInterval(changeFrequencies,30000);

  background(255);
  noLoop();
  
  initUI();
}

function draw(){
  if(!audioStarted) return;

  background(10,50);

  let level=amplitude.getLevel();

  maxSpeed=map(level,0,0.1,0.5,2);
  maxSpeed=constrain(maxSpeed,0.5,2);

  let yoff=0;
  for(let y=0;y<rows;y++){
    let xoff=0;
    for(let x=0;x<cols;x++){
      let index=x+y*cols;
      let angle=noise(xoff,yoff,zoff)*TWO_PI;
      let v=p5.Vector.fromAngle(angle);
      v.setMag(0.05);
      flowfield[index]=v;
      xoff+=inc;
    }
    yoff+=inc;
  }

  // Actualizar rotación del listener con el movimiento del mouse
  let targetRotY = map(mouseX, 0, width, -0.6, 0.6);
  let targetRotX = map(mouseY, 0, height, 0.2, -0.2);
  listenerRotX += (targetRotX - listenerRotX) * 0.02;
  listenerRotY += (targetRotY - listenerRotY) * 0.02;
  window.updateListener(0, 0, 0, listenerRotX, listenerRotY);

  for(let p of particles){
    p.follow(flowfield);
    p.update();
    p.edges();
    p.show(level);

    if(pointerActive){
      let dx=p.pos.x-pointerX;
      let dy=p.pos.y-pointerY;

      if(dx*dx+dy*dy<eraseRadiusSq){
        p.reset();
      }
    }
  }

  let globalGainMod=map(noise(frameCount*0.02),0,1,0.01,0.3)*0.3;

  for(let i=0;i<droneOsc.length;i++){
    droneOsc[i].freq(
      lerp(currentFreqs[i],targetFreqs[i],
      (frameCount%freqChangeDuration)/freqChangeDuration)
    );
    droneOsc[i].amp(globalGainMod * masterVolume,0.5);
  }

  zoff+=0.2;
}

function triggerTouchGrain(x,y){
  let osc=voicePool[voiceIndex];
  voiceIndex=(voiceIndex+1)%VOICES;

  let freq=map(y,0,height,1200,3000);
  let amp=map(x,0,width,0.01,0.08) * masterVolume;
  
  if(isMuted) amp = 0;

  osc.freq(freq);
  osc.amp(amp,0.01);
  osc.amp(0,0.08);

  if (audioStarted && osc) {
    let spatialData = window.createSpatialVoice(osc);
    if (spatialData) {
      let x3d = map(x, 0, width, -400, 400);
      let y3d = map(y, 0, height, -400, 400);
      let z3d = 0;
      window.updateSpatialVoice(osc, x3d, y3d, z3d);
    }
  }
}

function changeFrequencies(){
  for(let i=0;i<droneOsc.length;i++){
    currentFreqs[i]=targetFreqs[i];
    targetFreqs[i]=random(300,500);
  }
  for(let p of particles) p.reset();
}

function getTouchPos(){
  if(touches.length>0){
    return createVector(touches[0].x,touches[0].y);
  }
  return createVector(mouseX,mouseY);
}

function startAudio(){
  if(!audioStarted){
    userStartAudio();
    audioStarted=true;
    for(let osc of droneOsc) osc.amp(0.005,2);

    // Posicionar drones en espacio orgánico y asimétrico
    const dronePositions = [
      { x: -300, y: -100, z: -200 },
      { x: 250, y: -250, z: -100 },
      { x: 100, y: 200, z: 300 },
      { x: -200, y: 150, z: 400 },
      { x: 350, y: 50, z: -300 },
      { x: -350, y: -200, z: 150 },
      { x: 0, y: -300, z: -150 },
      { x: 150, y: 300, z: -250 }
    ];

    for(let i=0; i<droneOsc.length; i++) {
      let osc = droneOsc[i];
      let spatialData = window.createSpatialVoice(osc);
      if (spatialData) {
        let pos = dronePositions[i % dronePositions.length];
        window.updateSpatialVoice(osc, pos.x, pos.y, pos.z);
      }
    }

    window.updateListener(0, 0, 0, 0, 0);
    loop();
  }
}

function touchStarted(){
  startAudio();
  pointerX = touches[0].x;
  pointerY = touches[0].y;
  pointerActive = true;
  return false;
}
function touchMoved(){
  pointerX = touches[0].x;
  pointerY = touches[0].y;
  pointerActive = true;
  return false;
}
function touchEnded(){
  pointerActive = false;
}

function mouseMoved(){
  startAudio();
  pointerX = mouseX;
  pointerY = mouseY;
  pointerActive = true;
}

function mouseDragged(){
  pointerX = mouseX;
  pointerY = mouseY;
  pointerActive = true;
}

function mousePressed(){
  pointerX = mouseX;
  pointerY = mouseY;
  pointerActive = true;
}

function mouseReleased(){
  pointerActive = true;
}

class Particle{
  constructor(){
    this.pos=createVector(random(width),random(height));
    this.vel=createVector(0,0);
    this.acc=createVector(0,0);
  }

  follow(vectors){
    let x=floor(this.pos.x/scl);
    let y=floor(this.pos.y/scl);
    this.acc.add(vectors[x+y*cols]);
  }

  update(){
    this.vel.add(this.acc);
    this.vel.limit(maxSpeed);
    this.pos.add(this.vel);
    this.acc.mult(0);
  }

  edges(){
    if(this.pos.x>width)this.pos.x=0;
    if(this.pos.x<0)this.pos.x=width;
    if(this.pos.y>height)this.pos.y=0;
    if(this.pos.y<0)this.pos.y=height;
  }

  reset(){
    this.pos.set(random(width),random(height));
    this.vel.mult(0);
    this.acc.mult(0);
  }

  show(amp){
    let alpha=map(amp,0,0.1,50,255);
    alpha=constrain(alpha,50,255);

    fill(980,80,100,alpha);
    stroke(192,192,192,alpha);
    strokeWeight(1);

    beginShape();
    for(let i=0;i<floor(random(3,6));i++){
      curveVertex(
        this.pos.x+random(-30,30),
        this.pos.y+random(-10,20)
      );
    }
    endShape(CLOSE);
  }
}

function windowResized(){
  resizeCanvas(windowWidth,windowHeight);
}

    e.stopPropagation();
    telesmaDivEl.style.opacity = '0';
    telesmaDivEl.style.transform = 'translateX(-20px)';
    setTimeout(() => {
      telesmaDivEl.style.display = 'none';
    }, 300);
  });

  document.getElementById('closeBinaural').addEventListener('click',()=>{
    overlay.classList.remove('active');
  });

  overlay.addEventListener('click',(e)=>{
    if(e.target===overlay) overlay.classList.remove('active');
  });
}
</script>
</body>
</html>
