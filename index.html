<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EstimulaciónCerebral.Art&Psiq®-AlfonsoPretelt</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#ffffff;touch-action:none;}
canvas{display:block;}
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>

<script>
let inc=0.05,scl=10;
let cols,rows,zoff=0;
let particles=[],flowfield;
let maxSpeed=0.5;
let audioStarted=false;

let globalReverb,globalDelay,globalCompressor,amplitude;

let droneOsc=[],currentFreqs=[],targetFreqs=[],freqChangeDuration=10000;

let voicePool=[],voiceIndex=0,VOICES=20;

let erasePoint=null;
let eraseRadiusSq=120*120;

let lastTouchGrainTime=0;
let TOUCH_GRAIN_INTERVAL=30; // ms

function setup(){
  pixelDensity(1);
  createCanvas(windowWidth,windowHeight);
  frameRate(60);

  colorMode(HSB,660,900,100,10000);

  cols=floor(width/scl);
  rows=floor(height/scl);
  flowfield=new Array(cols*rows);

  globalReverb=new p5.Reverb();
  globalReverb.set(40,20);

  globalDelay=new p5.Delay();
  globalDelay.process(globalReverb,0.4,0.6,1800);

  globalCompressor=new p5.Compressor();
  globalCompressor.attack(0.02);
  globalCompressor.release(0.4);
  globalCompressor.threshold(-24);
  globalCompressor.ratio(8);
  globalCompressor.connect();

  amplitude=new p5.Amplitude();
  amplitude.setInput(globalCompressor);

  for(let i=0;i<8;i++){
    let osc=new p5.Oscillator('sine');
    let f=random(200,600);
    osc.freq(f);
    osc.amp(0);
    osc.disconnect();
    osc.connect(globalReverb);
    osc.connect(globalDelay);
    osc.connect(globalCompressor);
    osc.start();
    droneOsc.push(osc);
    currentFreqs.push(f);
    targetFreqs.push(f);
  }

  for(let i=0;i<VOICES;i++){
    let osc=new p5.Oscillator('sine');
    osc.amp(0);
    osc.disconnect();
    osc.connect(globalReverb);
    osc.connect(globalDelay);
    osc.connect(globalCompressor);
    osc.start();
    voicePool.push(osc);
  }

  for(let i=0;i<800;i++) particles.push(new Particle());

  setInterval(changeFrequencies,30000);

  background(255);
  noLoop();
}

function draw(){
  if(!audioStarted) return;

  background(10,50);

  let level=amplitude.getLevel();

  maxSpeed=map(level,0,0.1,0.5,2);
  maxSpeed=constrain(maxSpeed,0.5,2);

  let yoff=0;
  for(let y=0;y<rows;y++){
    let xoff=0;
    for(let x=0;x<cols;x++){
      let index=x+y*cols;
      let angle=noise(xoff,yoff,zoff)*TWO_PI;
      let v=p5.Vector.fromAngle(angle);
      v.setMag(0.05);
      flowfield[index]=v;
      xoff+=inc;
    }
    yoff+=inc;
  }

  for(let p of particles){
    p.follow(flowfield);
    p.update();
    p.edges();
    p.show(level);

    if(erasePoint){
      let dx=p.pos.x-erasePoint.x;
      let dy=p.pos.y-erasePoint.y;

      if(dx*dx+dy*dy<eraseRadiusSq){
        p.reset();

        let now=millis();
        if(now-lastTouchGrainTime>TOUCH_GRAIN_INTERVAL){
          triggerTouchGrain(p.pos.x,p.pos.y);
          lastTouchGrainTime=now;
        }
      }
    }
  }

  let globalGainMod=map(noise(frameCount*0.02),0,1,0.01,0.3)*0.3;

  for(let i=0;i<droneOsc.length;i++){
    droneOsc[i].freq(
      lerp(currentFreqs[i],targetFreqs[i],
      (frameCount%freqChangeDuration)/freqChangeDuration)
    );
    droneOsc[i].amp(globalGainMod,0.5);
  }

  zoff+=0.2;
}

/* 🔊 grano táctil sin setTimeout → baja latencia */
function triggerTouchGrain(x,y){
  let osc=voicePool[voiceIndex];
  voiceIndex=(voiceIndex+1)%VOICES;

  let freq=map(y,0,height,1200,3000);
  let amp=map(x,0,width,0.01,0.08);

  osc.freq(freq);
  osc.amp(amp,0.01);
  osc.amp(0,0.08); // release interno sin cola
}

function changeFrequencies(){
  for(let i=0;i<droneOsc.length;i++){
    currentFreqs[i]=targetFreqs[i];
    targetFreqs[i]=random(300,500);
  }
  for(let p of particles) p.reset();
}

/* 🔑 posición táctil real */
function getTouchPos(){
  if(touches.length>0){
    return createVector(touches[0].x,touches[0].y);
  }
  return createVector(mouseX,mouseY);
}

function startAudio(){
  if(!audioStarted){
    userStartAudio();
    audioStarted=true;
    for(let osc of droneOsc) osc.amp(0.005,2);
    loop();
  }
}

function touchStarted(){
  startAudio();
  erasePoint=getTouchPos();
  return false;
}
function touchMoved(){
  erasePoint=getTouchPos();
  return false;
}
function touchEnded(){
  erasePoint=null;
}

function mousePressed(){
  startAudio();
  erasePoint=getTouchPos();
}
function mouseDragged(){
  erasePoint=getTouchPos();
}
function mouseReleased(){
  erasePoint=null;
}

class Particle{
  constructor(){
    this.pos=createVector(random(width),random(height));
    this.vel=createVector(0,0);
    this.acc=createVector(0,0);
  }

  follow(vectors){
    let x=floor(this.pos.x/scl);
    let y=floor(this.pos.y/scl);
    this.acc.add(vectors[x+y*cols]);
  }

  update(){
    this.vel.add(this.acc);
    this.vel.limit(maxSpeed);
    this.pos.add(this.vel);
    this.acc.mult(0);
  }

  edges(){
    if(this.pos.x>width)this.pos.x=0;
    if(this.pos.x<0)this.pos.x=width;
    if(this.pos.y>height)this.pos.y=0;
    if(this.pos.y<0)this.pos.y=height;
  }

  reset(){
    this.pos.set(random(width),random(height));
    this.vel.mult(0);
    this.acc.mult(0);
  }

  show(amp){
    let alpha=map(amp,0,0.1,50,255);
    alpha=constrain(alpha,50,255);

    fill(980,80,100,alpha);
    stroke(192,192,192,alpha);
    strokeWeight(1);

    beginShape();
    for(let i=0;i<floor(random(3,6));i++){
      curveVertex(
        this.pos.x+random(-30,30),
        this.pos.y+random(-10,20)
      );
    }
    endShape(CLOSE);
  }
}

function windowResized(){
  resizeCanvas(windowWidth,windowHeight);
}
</script>
</body>
</html>
