<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EstimulaciónCerebral.Art&Psiq®-AlfonsoPretelt</title>

<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:#ffffff;
  touch-action:none;
}
canvas{display:block;}
</style>
</head>

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>

<script>
let inc=0.05,scl=10;
let cols,rows,zoff=0;

let particles=[];
let flowfield;

let maxSpeed=0.5;
let audioStarted=false;

let globalReverb,globalDelay,globalCompressor;
let globalOscillator=[];
let currentFreqs=[],targetFreqs=[];
let amplitude;

let touchPrev;
let touchVelocity=0;
let touchEnergy=0;

function setup(){
  createCanvas(windowWidth,windowHeight);
  colorMode(HSB,660,900,100,10000);

  cols=floor(width/scl);
  rows=floor(height/scl);
  flowfield=new Array(cols*rows);

  globalReverb=new p5.Reverb();
  globalReverb.set(50,30);

  globalDelay=new p5.Delay();
  globalDelay.process(globalReverb,0.5,0.7,2500);

  globalCompressor=new p5.Compressor();
  globalCompressor.attack(0.03);
  globalCompressor.release(0.5);
  globalCompressor.threshold(-30);
  globalCompressor.ratio(6);
  globalCompressor.connect();

  amplitude=new p5.Amplitude();
  amplitude.setInput(globalCompressor);

  for(let i=0;i<800;i++) particles.push(new Particle());

  background(255);
  noLoop();

  for(let i=0;i<8;i++){
    let osc=new p5.Oscillator('sine');
    let f=random(200,600);
    osc.freq(f);
    osc.amp(0);
    osc.disconnect();
    osc.connect(globalReverb);
    osc.connect(globalDelay);
    osc.connect(globalCompressor);
    osc.start();
    globalOscillator.push(osc);
    currentFreqs.push(f);
    targetFreqs.push(f);
  }

  setInterval(changeFrequencies,30000);
}

function draw(){
  if(!audioStarted) return;

  background(10,50);

  let level=amplitude.getLevel();

  touchEnergy*=0.9;

  maxSpeed=map(level+touchEnergy,0,0.2,0.5,2);
  maxSpeed=constrain(maxSpeed,0.5,2);

  let yoff=0;
  for(let y=0;y<rows;y++){
    let xoff=0;
    for(let x=0;x<cols;x++){
      let index=x+y*cols;

      let angle=noise(xoff,yoff,zoff)*TWO_PI;

      // perturbación táctil suave en el flowfield
      if(touchEnergy>0){
        let d=dist(x*scl,y*scl,mouseX,mouseY);
        if(d<150){
          angle+=map(d,0,150,0.8,0);
        }
      }

      let v=p5.Vector.fromAngle(angle);
      v.setMag(0.05);
      flowfield[index]=v;
      xoff+=inc;
    }
    yoff+=inc;
  }

  for(let p of particles){
    p.follow(flowfield);
    p.update();
    p.edges();
    p.show(level+touchEnergy);
  }

  // audio modulado por velocidad del gesto
  let gain=map(touchVelocity,0,50,0.005,0.15);
  gain=constrain(gain,0.005,0.15);

  for(let i=0;i<globalOscillator.length;i++){
    globalOscillator[i].freq(
      lerp(currentFreqs[i],targetFreqs[i],
      (frameCount%10000)/10000)
    );
    globalOscillator[i].amp(gain,0.2);
  }

  zoff+=0.2;
}

function changeFrequencies(){
  for(let i=0;i<globalOscillator.length;i++){
    currentFreqs[i]=targetFreqs[i];
    targetFreqs[i]=random(300,500);
  }
  for(let p of particles) p.reset();
}

function startAudio(){
  if(!audioStarted){
    userStartAudio();
    audioStarted=true;
    for(let osc of globalOscillator){
      osc.amp(0.005,2);
    }
    loop();
  }
}

/* =========================
   TOUCH / MOUSE
========================= */

function touchStarted(){startAudio();return false;}
function touchMoved(){handleGesture();return false;}
function mousePressed(){startAudio();}
function mouseDragged(){handleGesture();}

function handleGesture(){
  let pos=createVector(mouseX,mouseY);

  if(touchPrev){
    touchVelocity=p5.Vector.dist(pos,touchPrev);
    touchEnergy=map(touchVelocity,0,50,0,0.15);
  }

  touchPrev=pos.copy();

  // reset suave de partículas cercanas (sin spawn visible)
  for(let p of particles){
    let d=dist(pos.x,pos.y,p.pos.x,p.pos.y);
    if(d<120){
      p.vel.mult(0.2);
    }
  }
}

/* =========================
   PARTÍCULAS
========================= */

class Particle{
  constructor(){
    this.pos=createVector(random(width),random(height));
    this.vel=createVector(0,0);
    this.acc=createVector(0,0);
  }

  follow(vectors){
    let x=floor(this.pos.x/scl);
    let y=floor(this.pos.y/scl);
    let index=x+y*cols;
    this.applyForce(vectors[index]);
  }

  applyForce(f){this.acc.add(f);}

  update(){
    this.vel.add(this.acc);
    this.vel.limit(maxSpeed);
    this.pos.add(this.vel);
    this.acc.mult(0);
  }

  edges(){
    if(this.pos.x>width) this.pos.x=0;
    if(this.pos.x<0) this.pos.x=width;
    if(this.pos.y>height) this.pos.y=0;
    if(this.pos.y<0) this.pos.y=height;
  }

  reset(){
    this.pos=createVector(random(width),random(height));
    this.vel.mult(0);
    this.acc.mult(0);
  }

  show(amp){
    let alpha=map(amp,0,0.2,50,255);
    alpha=constrain(alpha,50,255);

    fill(980,80,100,alpha);
    stroke(192,192,192,alpha);
    strokeWeight(1);

    beginShape();
    for(let i=0;i<floor(random(3,6));i++){
      curveVertex(
        this.pos.x+random(-30,30),
        this.pos.y+random(-10,20)
      );
    }
    endShape(CLOSE);
  }
}

function windowResized(){
  resizeCanvas(windowWidth,windowHeight);
}
</script>

</body>
</html>
